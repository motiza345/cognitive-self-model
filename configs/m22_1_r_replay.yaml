  scores:
    formula: "|new - ref| <= score_atol + score_rtol * abs(ref)"
    fields: [s_null, s_intervened]
  deltas:
    formula: "|new - ref| <= delta_atol"
    fields: [actual_delta]
  means:
    formula: "|new - ref| <= mean_atol"
    fields:
      - evidence.discovery_mean
      - evidence.validation_mean
      - evidence.replication_mean
      - evidence.validation_control_mean
      - evidence.replication_control_mean
      - evidence.validation_paired_difference_mean
      - evidence.replication_paired_difference_mean
      - certificate.specificity.validation_target_mean
      - certificate.specificity.validation_control_mean
      - certificate.specificity.validation_paired_difference_mean
      - certificate.specificity.replication_target_mean
      - certificate.specificity.replication_control_mean
      - certificate.specificity.replication_paired_difference_mean
      - discovery_means
      - frozen_candidate.discovery_means
  null_near_zero:
    formula: "|new| <= null_atol AND |new - ref| <= delta_atol"
    fields:
      - null.max_abs
      - actual_delta where alpha == 0
  excluded_from_identity:
    - manifest.git_commit
    - manifest.git_branch
    - manifest.git_dirty
    - manifest.origin
    - certificate.git_commit
    - revision_source

tolerances:
  label: PROPOSED
  note: >
    Engineering acceptance thresholds, not proven numerical error bounds.
    Replay outputs must not be used to tune these values.
  score_atol: 1.0e-5
  score_rtol: 1.0e-5
  delta_atol: 1.0e-5
  mean_atol: 1.0e-6
  null_atol: 1.0e-6

tier_precedence:
  - REPLAY_INVALID
  - REPLAY_BLOCKED
  - REPLAY_DIVERGENT
  - REPLAY_EXACT
  - REPLAY_NUMERIC_EQUIVALENT
  - REPLAY_BEHAVIORAL_EQUIVALENT
  - REPLAY_DIVERGENT
tiers:
  REPLAY_INVALID: >
    Incomplete run, non-finite value, or missing or duplicate composite
    cell key. No success tier. Record the exact reason.
  REPLAY_BLOCKED: >
    Hub resolves to a different revision than recorded
    060db6499f32faf8b98477b0a26969ef7d8b9987, or the local cache lacks that
    revision; or a reference reports/M22_1/*.json sha256 changed; or the
    replay output path is not distinct from the reference path; or the
    worktree is dirty. Not a weight-hash mismatch (no reference weight hash
    exists).
  REPLAY_DIVERGENT: >
    Identity or structural mismatch, regardless of numeric closeness.
    Also the residual case after the success tiers fail.
  REPLAY_EXACT: >
    Identity fixed and every numeric comparison field equal (field equality,
    not whole-artifact bytes).
  REPLAY_NUMERIC_EQUIVALENT: >
    Identity fixed, every numeric field within its family tolerance, and
    behavioral decisions unchanged.
  REPLAY_BEHAVIORAL_EQUIVALENT: >
    Identity fixed, at least one numeric field outside tolerance, and
    behavioral decisions unchanged.
dec007_success_tiers:
  accepted: true
  tiers: [REPLAY_EXACT, REPLAY_NUMERIC_EQUIVALENT]
  note: >
    Accepted definition for M22.1-R. This replay still does not change
    M22.1 status by itself.

revision_pin:
  status: NOT_IMPLEMENTED
  recorded_revision: 060db6499f32faf8b98477b0a26969ef7d8b9987
  quote_loader_py_50: "info = model_info(model_id)"
  quote_loader_py_90: 'load_kwargs["revision"] = revision_info["model_revision"]'
  finding: >
    resolve_hf_revision calls model_info with the model id only. The sha
    from that call is the revision string passed to from_pretrained.
    Stubbing model_info changes which revision string reaches
    from_pretrained. It does not skip a network round-trip on an
    already-fully-qualified sha. Harness not written pending confirmation.

no_retry: true
blind:
  comparator_reads_replay_outputs_only_after_run_exits: true
  reference_hashes_rechecked_before_compare: true
output_rule:
  NO_SELF_HASH_EMBEDDING: true
  reference_hashes_in: artifacts/m22_1_r/manifest.sha256
