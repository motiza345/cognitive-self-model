  Any label assigned by this milestone does not change the status of
  F-M22.1.2-REINTERPRETATION. That finding status changes only via a
  separate DECISION. M22.1 stays CANDIDATE. M22.2 stays NOT AUTHORIZED.

amendments:
  - id: A1
    previous_sha256: ba80e3d4bfb1b234d0fa82d6b215195141f008936451aa200f35e721e2038598
    reason: >
      G1 M22.1.2 leading-energy source is UNSOURCED; remove weight-load
      dependency; decompose T1/T2 from stored fields; replace reconstructive
      G3 with structural least-squares G3; fix compute dtype, tolerances,
      energy/|cos| definitions, and split rule.
    statement: >
      Step A inspected field existence, dtype and shape only; no metric or
      numeric cell value was computed or inspected before this amendment.

oq003_resolution:
  question: OQ-003
  rule: "Load flags (fold_ln, centering) must be recorded explicitly, not inferred from the RMSNormPre class."
  recorded:
    source: artifacts/m22_1_3/results.json
    source_key: realized
    ln_final_class: RMSNormPre
    normalization_type: RMSPre
    ln_final_has_weight: false
    ln_final_weight_is_ones: false
    fold_ln: not_on_cfg
    center_writing_weights: not_on_cfg
    center_unembed: not_on_cfg
    eps: 1.0e-6
    readout_construction: unembed_difference_gain_folded_or_absent
  do_not_infer_fold_from_class: true

loader_processing:
  # Amendment A1 §1.2 — constructor kwargs actually passed.
  m22_1_loader:
    constructor: transformer_lens.HookedTransformer.from_pretrained
    citation: src/cognitive_self_model/m22_1/loader.py:75-93
    explicit_kwargs: [device, dtype]
    optional_kwarg: revision
    not_passed:
      - fold_ln
      - center_writing_weights
      - center_unembed
      - fold_value_biases
      - refactor_factored_attn_matrices
  m22_1_3_loader: "M22.1.3 predict.py:21,348 calls load_qwen; no separate constructor."
  constructor_defaults:
    transformer_lens_version: "3.9.0"
    version_source: artifacts/m22_1_3/results.json environment.transformer_lens
    citation: transformer_lens/HookedTransformer.py:1158-1174
    fold_ln: true
    center_writing_weights: true
    center_unembed: true
    fold_value_biases: true
    refactor_factored_attn_matrices: false
  cfg_recorded_after_load: not_on_cfg
  cfg_recorded_note: "inspect_loaded_model returns not_on_cfg when the flag is absent from model.cfg (predict.py:149-155,177-179)."

normalization:
  # A.1 — code path used by M22.1.3 Level B replay.
  level_b_path:
    module_margin: src/cognitive_self_model/m22_1_3/predict.py:67-74
    cell_write: src/cognitive_self_model/m22_1_3/predict.py:411-414
    compare_field: src/cognitive_self_model/m22_1_3/compare.py:420
  centering: no
  gain_form: none
  eps_value: 1.0e-6
  eps_placement: "inside sqrt after mean of squares: (x.pow(2).mean(-1, keepdim=True) + eps).sqrt()"
  ln_gain_folded_into_W_U: UNKNOWN
  first_order_helper:
    citation: src/cognitive_self_model/m22_1_3/predict.py:53-59
    R_definition: "R(x) = sqrt(mean(x^2) + eps)"
    jacobian: "j = (r·d)/R - (r·x)(x·d)/(n R^3)"
    delta1: "Δ₁ = α * j   # predict.py:418"

outcome:
  definition: >
    s = last-position logit of the first id of the positive text
    minus the last-position logit of the first id of the negative text.
  citation: src/cognitive_self_model/m22_1/outcome.py:1-5
  implementation: src/cognitive_self_model/m22_1/outcome.py:37-45
  token_ids: [9834, 902]
  class: LINEAR_IN_LOGITS
  softmax_jacobian: not_applicable

matrix_construction:
  source: src/cognitive_self_model/m22_1_2/protocol.py:552-558
  builder: src/cognitive_self_model/m22_1_2/data.py:43-68
  cell_value: actual_delta
  alpha: 1.0
  alpha_key: primary_alpha
  splits: [discovery, validation, replication]
  evaluation_splits: [validation, replication]
  discovery_role: descriptive_only
  shape: "6 prompts × 8 directions per split"
  prompt_order: "lexicographic prompt_id within split (data.py:36)"
  direction_ids: [D1, D2, D3, D4, D5, D6, D7, D8]
  direction_normalization: "unit-length; unit-Gaussian then Gram-Schmidt"
  centering_of_delta_matrix: no
  centering_before_svd: no

compute_dtype:
  # Amendment A1 §1.3
  delta_jacobian: float64
  r_dot_d: float64
  inv_rms: float64
  citation: src/cognitive_self_model/m22_1_3/predict.py:418-430
  note: >
    jacobian_first_order / rms_scale / torch.dot run on torch.float64 tensors;
    values are stored as Python float (IEEE-754 binary64). JSON numbers.

shapes:
