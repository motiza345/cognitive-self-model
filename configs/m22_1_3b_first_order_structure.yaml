sanity_gates:
  fail_action: "STOP, no label"
  compute_dtype: float64
  G0:
    statement: >
      inv_rms recomputed from clean_resid_l23_last.npy with eps=1e-6
      (R = sqrt(mean(x^2)+eps)) matches stored inv_rms.
    rel_tol: 1.0e-6
    rel_tol_rule: "1e-6 if compute dtype float64; 1e-4 if float32"
    fixed_from: "predict.py:418-430 float64"
  G1:
    source_status: IDENTICAL
    statement: >
      Recomputed uncentered leading energy (sigma_1^2 / sum_i sigma_i^2)
      of recorded Δ (matrices.{split}.alpha_plus1) must match
      reports/M22_1_1/README.md:42-44 within abs 1e-6 per split.
      Pass → INT-M22.1.2-ENERGY-UNSOURCED becomes RESOLVED_MISATTRIBUTION
      (value originates in M22.1.1, applies by identity).
    recorded_delta_path: reports/m22_1_2_response_space_results.json
    recorded_delta_sha256: b110683f4005b21230565628c28a949e24dcf6c109cecf7cf137f9a986be1cb4
    sourced_path: reports/M22_1_1/README.md
    sourced_lines: "42-44"
    sourced_values:
      validation: 0.999382
      replication: 0.999234
      discovery: 0.999294
    abs_tol: 1.0e-6
    energy_definition: "sigma_1^2 / sum_i sigma_i^2"
  G2:
    statement: "T1 leading energy == 1 within 1e-9 per split."
    abs_tol: 1.0e-9
  G3:
    statement: >
      Structural: for each prompt p, least-squares c_p fitting
      T2(p,·) ≈ c_p * (x_p · d) over the 8 directions, x_p from residual
      file, d from directions file. Pass if
      ||T2(p,·) − c_p (x_p·d)|| / ||T2(p,·)|| ≤ 1e-6 for all
      non-degenerate prompts in validation and replication. Also report
      implied (r·x_p) = c_p * n / (alpha * inv_rms_p^3).
    rel_tol: 1.0e-6
    required_splits: [validation, replication]
    degeneracy_guard:
      rule: "if ||T2(p,·)|| ≤ 1e-12 · ||T1(p,·)||, prompt p = DEGENERATE (reported, excluded from pass criterion)"
      ratio: 1.0e-12
      more_than_one_degenerate_in_split: "that split cannot support a label (INSUFFICIENT_EVIDENCE)"
  G4:
    available: true
    statement: >
      s_implied(p) = inv_rms_p · (r·x_p)_implied from G3.
      b_U is ABSENT_OR_ZERO: pass if |s_stored − s_implied| ≤ 1e-3 · max(1, |s_stored|)
      for all non-degenerate prompts in validation and replication.
    stored_s:
      path: artifacts/m22_1_3/predictions.json
      key: clean_margins[prompt_id].from_clean_logits
    b_U: ABSENT_OR_ZERO
    abs_coef: 1.0e-3
    required_splits: [validation, replication]

metrics:
  # Names only. Not computed in this step.
  - leading_energy_recorded_Delta
  - leading_energy_Delta1
  - leading_energy_T1
  - projection_share  # ||T2||_F^2 / ||Δ₁||_F^2
  - cosine_leading_left_recorded_Delta_vs_T1
  - cosine_leading_right_recorded_Delta_vs_T1
  energy_definition: "sigma_1^2 / sum_i sigma_i^2"
  singular_vector_similarity: "|cos|"

decision_rule:
  preregistered: true
  splits: "labels require validation AND replication to satisfy the rule; discovery is descriptive only"
  energy_definition: "sigma_1^2 / sum_i sigma_i^2"
  singular_vector_similarity: "|cos|"
  REINTERPRETATION_DESCRIPTIVELY_SUPPORTED: >
    |energy(Δ₁) − energy(recorded Δ)| ≤ 0.002
    AND both singular-vector |cos| ≥ 0.99
    AND projection share ≤ 0.01
    on both validation and replication
  PROJECTION_TERM_NON_NEGLIGIBLE: >
    the first two hold but projection share > 0.01
    on both validation and replication
  INSUFFICIENT_EVIDENCE: otherwise
  more_than_one_degenerate_in_an_evaluation_split: INSUFFICIENT_EVIDENCE
  no_label_if_gate_fails: true

output_rule:
  NO_SELF_HASH_EMBEDDING: true
  hashes_only_in: manifest.sha256
