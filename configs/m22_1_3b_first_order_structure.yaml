  n_equals_d_model: true
  d_model_source: artifacts/m22_1_3/results.json realized.d_model

cell_ordering:
  # Amendment A1 §1.5
  cell_keys: [prompt_id, split, regime, direction_id, alpha]
  cell_key_builder: src/cognitive_self_model/m22_1_3/predict.py:132-146
  nest_order: prompt then direction_id then alpha
  residual_row:
    citation: src/cognitive_self_model/m22_1_3/predict.py:356-378,397,407
    index: "residual_matrix[prompt_index[cell['prompt_id']]]"
    prompt_order: "frozen_prompts() sorted by prompt_id (m22_1/prompts.py:65-80)"
  direction_row:
    citation: src/cognitive_self_model/m22_1_3/predict.py:340,398,408
    index: "vectors[direction_index[cell['direction_id']]]"
    direction_order: "config direction_ids [D1..D8]"
  split_key: "cell['split'] == prompt.role (load_prompt_records predict.py:120-128)"
  link_to_m22_1_2_matrix: "(split, prompt_id, direction_id) at alpha == 1.0 → matrices[split].alpha_plus1"

formula:
  outcome_class: LINEAR_IN_LOGITS
  n: 896
  eps: 1.0e-6
  stored_field_decomposition:
    T1: "T1(p,d) = alpha * inv_rms_p * r_dot_d(p,d)"
    T2: "T2(p,d) = T1(p,d) - delta_jacobian(p,d)"
    weight_load: not_required
  analytic_identity:
    Delta1: "Δ₁_{p,d} = α * ((r·d)/R_p - (r·x_p)(x_p·d)/(n R_p^3))"
    T1_analytic: "α (r·d) / R_p"
    T2_analytic: "α (r·x_p)(x_p·d) / (n R_p^3)"
    note: "Stored-field T1/T2 implement the analytic split without r or W_U."
  nonlinear_softmax_term: not_applicable
  citation: src/cognitive_self_model/m22_1_3/predict.py:53-59,418-430

energy_definition:
  leading_energy: "sigma_1^2 / sum_i sigma_i^2"
  singular_vector_similarity: "|cos|"
  citation_of_same_definition_elsewhere: src/cognitive_self_model/m22_1_1/analyze.py:104-114

