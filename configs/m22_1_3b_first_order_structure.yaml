formula:
  outcome_class: LINEAR_IN_LOGITS
  n: 896
  n_source: artifacts/m22_1_3/results.json realized.d_model
  eps: 1.0e-6
  R_p: "sqrt(mean_i x_{p,i}^2 + eps)"
  x_hat_p: "x_p / R_p   # RMS-normalized; not x/||x||_2"
  Delta1: "Δ₁_{p,d} = (α / R_p) * [(r·d) - (r·x̂_p)(x̂_p·d)/n]"
  equivalent: "Δ₁_{p,d} = α * ((r·d)/R_p - (r·x_p)(x_p·d)/(n R_p^3))"
  decomposition:
    T1: "T1_{p,d} = α (r·d) / R_p     # rank-1: a_p b_d with a_p=α/R_p, b_d=r·d"
    T2: "T2_{p,d} = α (r·x_p)(x_p·d) / (n R_p^3)"
    identity: "Δ₁ = T1 - T2"
  nonlinear_softmax_term: not_applicable
  citation: src/cognitive_self_model/m22_1_3/predict.py:53-59,418

