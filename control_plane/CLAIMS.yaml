open_questions:
  - id: OQ-001
    statement: "Descriptive check (M22.1.3b): decompose the exact first-order readout Δ₁ = (α/R_p)[(r·d) − (r·x̂_p)(x̂_p·d)/n] into a rank-1 term and a projection term; report SVD leading energy of recorded Δ, Δ₁, rank-1 term alone, and the energy share of the projection term, on exactly the M22.1.2 matrix construction. Depends on OQ-003 (normalization/centering flags)."
  - id: OQ-002
    statement: "Implied clean margin s ≈ −3 logits vs stored s_null (descriptive)"
  - id: OQ-003
    statement: "Load flags (fold_ln, centering) must be recorded explicitly, not inferred from the RMSNormPre class"
  - id: OQ-004
    statement: "M22.1.4: direct path must be defined on x_final (not x_L); mediated = total − direct is a counterfactual contrast, not additive"
  - id: OQ-005
    statement: "M22.1.4: preregister dose rule (α_p = ρ·‖x_{L,p}‖ vs fixed α with recorded ρ)"
