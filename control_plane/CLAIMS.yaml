  - id: F-M22.1.2-REINTERPRETATION
    kind: finding
    milestone: M22.1.2
    statement: |
      The near rank-1 prompt × direction structure reported in M22.1.2 is analytically
      accounted for by the first-order readout form Δ ≈ α·(r·d)/R(x_p), an outer product of a
      prompt factor and a direction factor. Under the tested protocol (L23 site), that
      structure therefore provides no evidence for response structure beyond final-readout
      geometry. Status of the quantitative link: analytical and post hoc. A descriptive check
      (SVD of the Δ₁ matrix vs the M22.1.2 leading energy) is pending (OQ-001).
    scope:
      model: Qwen/Qwen2.5-0.5B
      revision: "060db6499f32faf8b98477b0a26969ef7d8b9987"
      site: blocks.23.hook_resid_post
      outcome: "logit_margin token ids 9834 and 902"
      intervention_family: "frozen M22.1.1 D1–D8 panel at L23"
      observation_contract: "M22.1.3 readout-null protocol; prompt_manifest_sha256 fad6049b26ee8444ef39360b27b4cb328ed0691279b54a9b54e8c6227dda94db"
    evidence:
