  - id: F-M22.1.3-READOUT
    kind: finding
    milestone: M22.1.3
    statement: |
      At L23 (blocks.23.hook_resid_post), the recorded M22.1/M22.1.1 intervention effects are
      exactly reconstructible, within the preregistered tolerance, by applying the realized
      final RMS normalization and unembedding to the clean final residual plus the
      intervention vector (Level B pass 192/192 on validation and replication). The local
      readout Jacobian agrees with the exact reconstruction (R² ≥ 0.9998, sign agreement 1.0
      on both label splits). Scope: this site, frozen outcome, intervention family, model
      revision and observation contract. No evidence for semantic identity,
      self-representation, or any mechanism beyond the final readout computation.
    scope:
      model: Qwen/Qwen2.5-0.5B
      revision: "060db6499f32faf8b98477b0a26969ef7d8b9987"
