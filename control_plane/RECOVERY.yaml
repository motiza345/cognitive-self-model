recovery_grade_criteria:
  EXACT: clean commit + config hash + full env + hashed inputs/outputs + documented entrypoint
  PARTIAL: any of the EXACT items missing; listed in `missing`
  POINTER_ONLY: a named pointer exists (notebook, README, or config mention) but the run is not reconstructable from recorded
    hashes and env
  ABSENT: no files, report, or reconstructable pointer
  chain_rule: recovery_grade_chain is the worst grade over self and all upstream depends_on (ABSENT < POINTER_ONLY < PARTIAL
    < EXACT)
