  class: UNCOUNTED_P_CONSTRUCTION
  resolution: >
    Both runs are P construction attempts. DEC-011 excludes P construction from
    the MRSM full-run counters, and the MRSM window had not started because
    p_freeze did not exist. Neither counter is incremented. Each run did
    generate a holdout dataset and hash its tokens and targets. That is
    holdout generation and content access, which p_construction.holdout_access
    forbids. Neither run applied the model to holdout: accuracy and margin
    stayed null. The v1 manifest label LOCKED_NOT_TOUCHED_IN_SMOKE does not
    match that generation and hash. The holdout was not a split locked before
    the run; the same process created it. These attempts are therefore not
    recorded as MRSM Full Runs.

